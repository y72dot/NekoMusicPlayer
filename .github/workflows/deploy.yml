name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  check:
    name: Typecheck, unit tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run check
      - run: node scripts/validate-production.mjs

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: production-build-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 3

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=4 --reporter=line

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy verified build
    needs: [check, e2e]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v4

      - name: Download verified production build
        uses: actions/download-artifact@v4
        with:
          name: production-build-${{ github.sha }}
          path: dist

      - name: Deploy via rsync
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          PUBLIC_URL: https://music.72dot.cn
        run: |
          set -euo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          sudo apt-get install -y sshpass
          mkdir -p ~/.ssh
          printf '%s\n' '124.221.182.13 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIB1aihNvsJykvm35eT1+VsGcb4tRa2hld6NqH+MUV8i/' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          rsync -e "sshpass -e ssh" \
            -rltgoDzvO --delete \
            dist/ "$SSH_USER@$SSH_HOST:/var/www/nekomusic/releases/${{ github.run_id }}/"
          sshpass -e scp "ops/deploy/manage-release.sh" "$SSH_USER@$SSH_HOST:/tmp/nekomusic-manage-${{ github.run_id }}.sh"
          sshpass -e ssh "$SSH_USER@$SSH_HOST" \
            "bash /tmp/nekomusic-manage-${{ github.run_id }}.sh activate ${{ github.run_id }}"

          rollback() {
            sshpass -e ssh "$SSH_USER@$SSH_HOST" \
              "bash /tmp/nekomusic-manage-${{ github.run_id }}.sh rollback ${{ github.run_id }}" || true
          }
          trap rollback ERR

          curl --fail --silent --show-error --retry 4 --retry-all-errors \
            --max-time 15 "$PUBLIC_URL/healthz"
          curl --fail --silent --show-error --retry 4 --retry-all-errors \
            --max-time 15 "$PUBLIC_URL/" > /dev/null

          trap - ERR
          sshpass -e ssh "$SSH_USER@$SSH_HOST" \
            "bash /tmp/nekomusic-manage-${{ github.run_id }}.sh finalize ${{ github.run_id }} && rm -f /tmp/nekomusic-manage-${{ github.run_id }}.sh"
