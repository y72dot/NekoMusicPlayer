# Production configuration for music.72dot.cn.
# HTTP to HTTPS redirect; keep ACME renewal reachable.
server {
    listen 80;
    listen [::]:80;
    server_name music.72dot.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name music.72dot.cn;

    ssl_certificate /etc/letsencrypt/live/72dot.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/72dot.cn/privkey.pem;
    include snippets/ssl-params.conf;
    include snippets/security-headers.conf;

    root /var/www/nekomusic/current;
    index index.html;

    access_log /var/log/nekomusic/access.log;
    error_log /var/log/nekomusic/error.log;
    client_max_body_size 100M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript image/svg+xml application/wasm;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /sw.js {
        try_files $uri =404;
        expires -1;
    }

    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|webmanifest|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    location /api/netease/ {
        proxy_pass https://music.163.com/;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host music.163.com;
        proxy_set_header Referer https://music.163.com;
        proxy_set_header Cookie $http_x_neko_upstream_cookie;
        proxy_set_header X-Neko-Upstream-Cookie "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
        proxy_buffering off;
    }

    # NetEase playback URLs are signed for their original protocol and CDN host.
    # Keep both values unchanged behind a same-origin, allowlisted proxy so the
    # browser never makes mixed-content or cross-origin media requests.
    location ~ ^/api/netease-media/http/(?<netease_http_host>[a-z0-9-]+(?:\.[a-z0-9-]+)*\.music\.126\.net)(?<netease_http_path>/.*)$ {
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        proxy_pass http://$netease_http_host$netease_http_path$is_args$args;
        proxy_set_header Host $netease_http_host;
        proxy_set_header Referer https://music.163.com;
        proxy_set_header Cookie "";
        proxy_set_header X-Neko-Upstream-Cookie "";
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
        add_header Cache-Control "private, max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ ^/api/netease-media/https/(?<netease_https_host>[a-z0-9-]+(?:\.[a-z0-9-]+)*\.music\.126\.net)(?<netease_https_path>/.*)$ {
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        proxy_pass https://$netease_https_host$netease_https_path$is_args$args;
        proxy_ssl_server_name on;
        proxy_ssl_name $netease_https_host;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host $netease_https_host;
        proxy_set_header Referer https://music.163.com;
        proxy_set_header Cookie "";
        proxy_set_header X-Neko-Upstream-Cookie "";
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
        add_header Cache-Control "private, max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /api/bilibili-audio/ {
        proxy_pass https://www.bilibili.com/;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host www.bilibili.com;
        proxy_set_header Referer https://www.bilibili.com;
        proxy_set_header Cookie $http_x_neko_upstream_cookie;
        proxy_set_header X-Neko-Upstream-Cookie "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
    }

    location /api/bilibili/ {
        proxy_pass https://api.bilibili.com/;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host api.bilibili.com;
        proxy_set_header Referer https://www.bilibili.com;
        proxy_set_header Cookie $http_x_neko_upstream_cookie;
        proxy_set_header X-Neko-Upstream-Cookie "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
    }

    location ~ ^/api/bilibili-cdn/(?<cdn_host>[a-z0-9-]+(?:\.[a-z0-9-]+)*\.(?:bilivideo\.com|hdslb\.com))(?<cdn_path>/.*)$ {
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        proxy_pass https://$cdn_host$cdn_path$is_args$args;
        proxy_ssl_server_name on;
        proxy_ssl_name $cdn_host;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host $cdn_host;
        proxy_set_header Referer https://www.bilibili.com;
        proxy_set_header Cookie "";
        proxy_set_header X-Neko-Upstream-Cookie "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering off;
        add_header Cache-Control "private, max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /api/ {
        return 404;
    }
}
